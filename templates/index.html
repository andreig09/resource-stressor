<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Observability POC</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: system-ui, sans-serif;
      background: #0f1117;
      color: #e2e8f0;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 2rem;
      padding: 2rem;
    }

    h1 { font-size: 1.6rem; letter-spacing: 0.05em; color: #94a3b8; }

    .cards {
      display: flex;
      gap: 2rem;
      flex-wrap: wrap;
      justify-content: center;
    }

    .card {
      background: #1e2130;
      border: 1px solid #2d3148;
      border-radius: 12px;
      padding: 2rem;
      width: 280px;
      display: flex;
      flex-direction: column;
      gap: 1.2rem;
      align-items: center;
    }

    .card h2 { font-size: 1.1rem; color: #cbd5e1; }

    .metric {
      font-size: 2.4rem;
      font-weight: 700;
      font-variant-numeric: tabular-nums;
    }

    .metric.cpu  { color: #f97316; }
    .metric.mem  { color: #38bdf8; }

    .metric-label { font-size: 0.75rem; color: #64748b; margin-top: -0.8rem; }

    .btn-group { display: flex; gap: 0.6rem; width: 100%; }

    button {
      flex: 1;
      padding: 0.6rem 0;
      border: none;
      border-radius: 8px;
      font-size: 0.95rem;
      font-weight: 600;
      cursor: pointer;
      transition: opacity 0.15s;
    }
    button:hover { opacity: 0.85; }
    button:active { opacity: 0.7; }

    .btn-add     { background: #f97316; color: #fff; }
    .btn-release { background: #334155; color: #cbd5e1; }
    .btn-add.mem { background: #0284c7; }
    .btn-err400  { background: #d97706; color: #fff; }
    .btn-err500  { background: #dc2626; color: #fff; }

    .toast {
      position: fixed;
      bottom: 1.5rem;
      left: 50%;
      transform: translateX(-50%);
      padding: 0.5rem 1.2rem;
      border-radius: 8px;
      font-size: 0.85rem;
      font-weight: 600;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.2s;
    }
    .toast.show { opacity: 1; }

    .status-bar {
      font-size: 0.8rem;
      color: #475569;
      text-align: center;
    }

    .dot {
      display: inline-block;
      width: 8px; height: 8px;
      border-radius: 50%;
      background: #22c55e;
      margin-right: 6px;
      animation: pulse 2s infinite;
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50%       { opacity: 0.3; }
    }
  </style>
</head>
<body>

  <h1>Observability POC &mdash; Resource Stressor</h1>

  <div class="cards">

    <!-- CPU card -->
    <div class="card">
      <h2>CPU Load</h2>
      <div class="metric cpu" id="cpu-val">0</div>
      <div class="metric-label">target CPU %</div>
      <div class="btn-group">
        <button class="btn-add"     onclick="api('/api/cpu/add')">+ 10%</button>
        <button class="btn-release" onclick="api('/api/cpu/release')">&#8722; 10%</button>
      </div>
    </div>

    <!-- Memory card -->
    <div class="card">
      <h2>RAM Pressure</h2>
      <div class="metric mem" id="mem-val">0</div>
      <div class="metric-label">MB allocated</div>
      <div class="btn-group">
        <button class="btn-add mem" onclick="api('/api/memory/add')">+ Alloc 256 MB</button>
        <button class="btn-release" onclick="api('/api/memory/release')">&#8722; Release</button>
      </div>
    </div>

    <!-- Errors card -->
    <div class="card">
      <h2>Error Triggers</h2>
      <div class="metric" style="font-size:1.4rem; color:#94a3b8;">HTTP Errors</div>
      <div class="metric-label">generates error traces in Tempo</div>
      <div class="btn-group">
        <button class="btn-err400" onclick="triggerError('/api/error/400', '400 Bad Request')">Trigger 400</button>
        <button class="btn-err500" onclick="triggerError('/api/error/500', '500 Server Error')">Trigger 500</button>
      </div>
    </div>

  </div>

  <div id="toast" class="toast"></div>

  <div class="status-bar">
    <span class="dot"></span>Polling every 3 s
  </div>

  <script>
    async function api(path) {
      try {
        const res = await fetch(path, { method: 'POST' });
        const data = await res.json();
        update(data);
      } catch (e) {
        console.error(e);
      }
    }

    async function triggerError(path, label) {
      try {
        const res = await fetch(path, { method: 'POST' });
        const data = await res.json();
        showToast(`${label} sent (trace recorded)`, res.ok ? '#22c55e' : '#f97316');
      } catch (e) {
        showToast('Request failed', '#dc2626');
        console.error(e);
      }
    }

    function showToast(msg, color) {
      const t = document.getElementById('toast');
      t.textContent = msg;
      t.style.background = color;
      t.style.color = '#fff';
      t.classList.add('show');
      setTimeout(() => t.classList.remove('show'), 2500);
    }

    function update(data) {
      if (data.cpu_percent !== undefined) document.getElementById('cpu-val').textContent = data.cpu_percent;
      if (data.memory_mb   !== undefined) document.getElementById('mem-val').textContent = data.memory_mb;
    }

    async function poll() {
      try {
        const res = await fetch('/api/status');
        update(await res.json());
      } catch (e) {}
    }

    poll();
    setInterval(poll, 3000);
  </script>
</body>
</html>
